<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
    <script src="script.js" defer></script>
<body id="body">
    <div id="library">
    
    </div>

    <button id="newBook" command="show-modal" commandfor="my-dialog">New Book</button>
    <dialog id="my-dialog">
        <form novalidate>

            
            <label for="bookTitle">
            <span>Please enter book title:</span>
            <input type="text" name="bookTitle" id="bookTitle">
            <span id="titleError" class="error"></span>
            </label>
            <br>


            <label for="bookAuthor">
            <span>Please enter book author:</span>
            <input type="text" name="bookAuthor" id="bookAuthor">
            <span id="authorError" class="error"></span>
            </label>
            <br>


            <label for="bookPages">
            <span>Please enter book pages:</span>
            <input type="number" name="bookPages" id="bookPages">
            <span id="pageError" class="error"></span>
            </label>
            <br>


            <label for="bookRead">Read:</label>
            <input type="checkbox" name="bookRead" id="bookRead">
            <br>
            <input type="submit" name="bookSubmut" id="bookSubmit";>
        </form>
    </dialog>
</body>
</html>
